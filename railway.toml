# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code

[build]
# Use the Dockerfile at the root of the repository
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Health check — Railway will poll this until it returns 200
healthcheckPath = "/"
healthcheckTimeout = 300   # seconds — allow time for ML model loading

# Restart policy on failure
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Railway injects PORT env var; we hard-code 8000 in CMD but this makes it explicit
# [deploy.env]
# PORT = "8000"
